openapi: 3.0.0
info:
  title: API ドキュメント
  version: 1.0.0
  description: トマトノート(仮)のAPIドキュメントです。
servers:
  - url: http://localhost:3000
    description: ローカル開発サーバー
paths:
  /auth/register:
    post:
      summary: ユーザー登録
      description: 新しいユーザーアカウントを作成します。
      tags:
        - 認証
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  example: "password123"
                name:
                  type: string
                  example: "Taro Kono"
      responses:
        '201':
          description: ユーザーが正常に作成されました。
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "01J8Z340P3TYJQAXTF8D9X5N2X"
                  email:
                    type: string
                    example: "user@example.com"
                  name:
                    type: string
                    example: "Taro Kono"
        '400':
          description: リクエストのペイロードが無効です。
        '409':
          description: メールアドレスが既に存在します。

  /auth/login:
    post:
      summary: ユーザーログイン
      description: ユーザーを認証し、セッションまたはJWTトークンを作成します。
      tags:
        - 認証
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  example: "password123"
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "01J8Z340P3TYJQAXTF8D9X5N2X"
                      email:
                        type: string
                        example: "user@example.com"
                      name:
                        type: string
                        example: "Taro Kono"
        '401':
          description: メールアドレスまたはパスワードが無効です。

  /auth/logout:
    post:
      summary: ログアウト
      description: 現在のセッションまたはトークンを無効にします。
      tags:
        - 認証
      responses:
        '200':
          description: ログアウト成功。
        '401':
          description: 認証されていません。

  /auth/me:
    get:
      summary: 現在認証されているユーザー情報の取得
      description: 提供されたトークンに関連付けられたユーザーを返します。
      tags:
        - 認証
      responses:
        '200':
          description: 現在のユーザー情報
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "01J8Z340P3TYJQAXTF8D9X5N2X"
                  email:
                    type: string
                    example: "user@example.com"
                  name:
                    type: string
                    example: "Taro Kono"
        '401':
          description: 認証されていません。
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: "01J8Z340P3TYJQAXTF8D9X5N2X"
        email:
          type: string
          example: "user@example.com"
        name:
          type: string
          example: "Taro Kono"
        password:
          type: string
          example: "hashed_password"