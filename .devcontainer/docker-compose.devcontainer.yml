services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEVCONTAINER_UBUNTU_VERSION: ${DEVCONTAINER_UBUNTU_VERSION}
        NODE_VERSION: ${NODE_VERSION}
    volumes:
      # Volume Trickでホストとのマウントを防ぐ
      - type: volume
        source: frontend_node_modules
        target: /workspace/frontend/node_modules/
      # - type: volume
      #   source: frontend_next
      #   target: /workspace/frontend/.next/
      - type: volume
        source: backend_node_modules
        target: /workspace/backend/node_modules/
      # - type: volume
      #   source: backend_dist
      #   target: /workspace/backend/dist/
      # プロジェクトルート
      - type: bind
        source: ..
        target: /workspace
    command: sleep infinity
    tty: true

volumes:
  frontend_node_modules: {}
  frontend_next: {}
  backend_node_modules: {}
  backend_dist: {}
