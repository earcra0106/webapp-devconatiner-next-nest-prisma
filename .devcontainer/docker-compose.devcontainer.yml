services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEVCONTAINER_UBUNTU_VERSION: ${DEVCONTAINER_UBUNTU_VERSION}
        NODE_VERSION: ${NODE_VERSION}
    volumes:
      # Volume Trickでホストとのマウントを防ぐ
      - type: volume
        source: frontend_node_modules
        target: /workspace/frontend/node_modules/
      - type: volume
        source: backend_node_modules
        target: /workspace/backend/node_modules/
      # プロジェクトルート
      - type: bind
        source: ..
        target: /workspace
    environment:
      TZ: "Asia/Tokyo"
    command: sleep infinity
    tty: true
  db:
    image: postgres:16.11
    ports:
      - 5432:5432
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mydatabase
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
      TZ: "Asia/Tokyo"
    hostname: postgres
    restart: always

volumes:
  frontend_node_modules: {}
  backend_node_modules: {}
  postgres_data: {}
