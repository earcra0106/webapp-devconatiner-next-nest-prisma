services:
  web:
    build:
      context: .
      dockerfile: ./docker/web/Dockerfile
    ports:
      - "${WEB_HOST_PORT}:${WEB_CONTAINER_PORT}"
    environment:
      # nginx/conf.d/default.conf.templateで使用する環境変数
      - WEB_PORT=${WEB_CONTAINER_PORT}
      - FRONTEND_CONTAINER_PORT=${FRONTEND_CONTAINER_PORT}
      - BACKEND_CONTAINER_PORT=${BACKEND_CONTAINER_PORT}
    container_name: ssp_web_container
  frontend:
    build:
      context: .
      dockerfile: ./docker/frontend/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
        FRONTEND_CONTAINER_PORT: ${FRONTEND_CONTAINER_PORT}
    container_name: ssp_frontend_container
  backend:
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
        BACKEND_CONTAINER_PORT: ${BACKEND_CONTAINER_PORT}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    container_name: ssp_backend_container
  postgres:
    image: postgres:16.11
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
      TZ: "Asia/Tokyo"
    restart: always
    container_name: ssp_postgres_container

volumes:
  postgres_data: {}
